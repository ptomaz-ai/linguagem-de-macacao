<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 2 - Table</title>
	</head>
	<body>
		<table border="1" width="100%">
		<tr style="background-color:purple; color: white">
			<th>Cabeçalho 1</th>
			<th>Cabeçalho 2</th>
			<th>Cabeçalho 3</th>
		</tr>
		
		<tr>
			 <td style="background-color:#000;color:#FFF;">conteudo 1</td>
			 <td>
				<Table border="1" width="100%">
					<tr>
						<td style="background-color: yellow;">1</td>
						<td style="background-color: red; color: #FFF; text-align:right;">2</td>
					</tr>
					<tr>
						<td style="background-color: blue; color: #FFF; text-align:right;">3</td>
						<td style="background-color: #2cff05;">4</td>
					</tr>
				
				</table>
			 </td>
			 <td style="background-image:url('https://i.pinimg.com/474x/a4/74/fd/a474fdb574fd88ba05900ce6d39573db.jpg');">conteudo 3</td>
		</tr>
		<tr>
			<td style="background-color:#000;color:#FFF;">conteudo 4</td>
			<td style="background-image:url('https://i.pinimg.com/736x/ed/31/16/ed3116bc184a2e15a888f0849c935e4e.jpg');">conteudo 5</td>
			<td>
				<Table border="1" width="100%">
					<tr>
						<td style="background-color: orange; text-align:center;">5</td>
						<td style="background-color: pink;">6</td>
					</tr>
					<tr>
						<td style="background-color: red; color:text-align:right;">7</td>
						<td style="background-color: orange; text-align:center;">8</td>
					</tr>
				
				</table>
			 </td>
		</tr>
		</table>
	</body>
</html>
