<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 1 Tanble </title>
	</head>
	<body>
<header style="background-color: #008000">
<h1 style="text-align: center; color: #000;">Tanble de Serviço Mecânicos</h1>
</header>
		<Table border="1" width="100%">
			<!-- tbody -> table -> corpo da tabela -->
			<tbody>
				<tr>
					<!-- th -> tenble head -> cabeçalho -->
					<th rowspan="5" style="background-color: green; color: #000;">nacionais</th>
					<th style="background-color: ; color: #FFF;">veiculos</th>
					<th style="background-color: gray; color: #FFF;">Serviço</th>
					<th style="background-color: gray; color: #FFF;">tempo Previsto</th>
					<th style="background-color: gray; color: #FFF;">valor</th>
				</tr>
				<!-- criando a segunda linha -->
				<!-- linha da tabela -> table row -> tr -->
				<tr>
					<td>caminhonete S10</td>
					<td>Suspensão</td>
					<td>3 horas e 25</td>
					<td>350,00</td>
				</tr>
				
				<!-- criando a terceira linha linha -->
				<!-- linha da tabela -> table row -> tr -->
				<tr>
					<td>caminhonete</td>
					<td>freio</td>
					<td>3 horas e 45 minutos</td>
					<td>200,00</td>
				</tr>
				
				<tr>
					<td>caminhonete</td>
					<td>troca de freio</td>
					<td>30 minutos</td>
					<td>25,00</td>
				</tr>
				
				<tr>
					<td>caminhonete</td>
					<td>alinhamento</td>
					<td>1 hora e 40 minutos</td>
					<td>220,00</td>
				</tr>
			
				
			</tbody>
		</Table>
	</body>
</html>
