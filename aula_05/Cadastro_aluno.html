<!DOCYTPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Cadastro do aluno</title>
	</head>
	<body>
		<header>
			<h1 style="text- center">Cadastro de aluno</h1>
			<hr>
		</header>
		
		<form action="#" method="POST">
			<label for="nome">nome do aluno:</label>
			<br>
			<input type="text" id="nome" name="nome"placeholder="nome do aluno..." minlength="3" maxlength="255" required>
			<br><br>
			
			<label for="ra">Resgistro do aluno</label>
			<br>
			<input type="text" id="ra" name="ra" value="20394834" disabled>
			<br>
			
			<label for="email">E-mail do aluno</label>
			<br>
			<input type="email" id="email" name="email" placeholder="email@email.com" required>
			<br><br>
			
			<label for="telefone">telefone do aluno:</label>
			<br>
			<input type="tel" id="telefone" name="telefone" placeholder="(00) 0000-0000" required>
			<br><br>
			
			<label for="data_nascimento">Data de Nascimento</label>
			<br>
			<input type="date" id="data_nascimento" name="data_nascimento" max="2009/07/29" required>
			<br><br>
			
			<label for="idade">idade</label>
			<br>
			<input type="number" id="idade" name="idade" min="17" max="100" required>
			<br><br>
			
			<label for="genero">Gênero</label>
			<br>
			<input type="radio" id="masculino" name="genero" value="masculino" required>masculino
			<br>
			<input type="radio" id="feminino" name="genero" value="feminino">feminino
			<br>
			<input type="radio" id="outros" name="genero" value="outros">outros
			<br><br>
			
			<label for="turma">selecione a turma</label>
			<br>
			<select name="turma" id="turma">
				<option value="selecione">selecione...</option>
				<option value="1EMA">1º EM A</option>
				<option value="1EMB">1º EM B</option>
				<option value="2EMA">2º EM A</option>
				<option value="2EMB">2º EM B</option>
				<option value="3EMA">3º EM A</option>
				<option value="3EMB">3º EM B</option>
			</select>
			<br><br>
			
			<label for="foto">foto do aluno:</label>
			<br>
			<input type="file" id="foto" name="foto" required>
			<br><br>
			
			<label for="comentarios">reclamação, comentarios e elogios...</label>
			<br>
			<textarea id="comentarios" name="comentarios" placeholder="texto..."></textarea>
			<br><br>
			
			<input type="checkbox" id="termos" name="termos" required>li e aceito os termos e condições
			<br>
			<input type="checkbox" id="notificações"name="notificações">Aceito receber notificacões
			<br>
			<input type="submit" value="cadastrar aluno">
		
		</form>
	</body>
	
</html>
